# Trip2World coturn configuration.
#
# Values that differ per deployment (secret, realm, external IP, port range) are
# passed on the command line from docker-compose.yml so this file stays free of
# secrets and can be committed.
#
# NETWORK REQUIREMENTS — these ports must reach this host DIRECTLY from the
# internet. Cloudflare's proxy cannot carry them: TURN is UDP, and the proxy only
# handles HTTP/WebSocket. Use a DNS-only (grey cloud) record for the TURN domain.
#
#   3478/udp, 3478/tcp     STUN + TURN
#   5349/tcp               TURN over TLS (optional)
#   49160-49200/udp        relay range
#
# Without a reachable TURN server, users behind symmetric NAT (common on mobile
# carriers and corporate networks) will never establish a call. This is not an
# optional hardening step; it is required for the product to work.

listening-port=3478
tls-listening-port=5349

fingerprint

# ─────────────────────────────────────────────────────────────────────────────
# Authentication
# ─────────────────────────────────────────────────────────────────────────────
#
# Time-limited credentials derived by the API (see packages/auth/src/turn.ts).
# coturn recomputes HMAC-SHA1(secret, "<expiry>:<userId>") and rejects anything
# whose embedded timestamp has passed. No user database, no provisioning, and a
# leaked credential is useless within two hours.
use-auth-secret
# static-auth-secret and realm are supplied by docker-compose from the .env file.

# ─────────────────────────────────────────────────────────────────────────────
# Abuse prevention
# ─────────────────────────────────────────────────────────────────────────────
#
# An open TURN server is a free anonymising relay and will be found and abused
# within days of being exposed. These denied peer ranges stop a client using the
# relay to reach RFC1918 addresses, loopback, or link-local metadata endpoints —
# i.e. they stop TURN being turned into an SSRF pivot into the host's own network.
no-multicast-peers

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Per-user and total relay caps. A single account cannot exhaust the relay.
user-quota=12
total-quota=1200

# Bandwidth ceiling per allocation, bytes/second. 0 = unlimited.
# 3 Mbit/s is generous for one-to-one video and blunts bulk-transfer abuse.
max-bps=384000

# ─────────────────────────────────────────────────────────────────────────────
# Hardening
# ─────────────────────────────────────────────────────────────────────────────

# The CLI is an unauthenticated local control channel; there is no reason to run it.
no-cli

# Legacy TURN (RFC 5766 without the long-term credential mechanism).
no-tcp-relay

# Refuse obsolete TLS. Only relevant when TURN over TLS is enabled.
no-tlsv1
no-tlsv1_1

# stdout so `docker logs coturn` works; coturn's own file rotation is not used.
log-file=stdout
simple-log

# Relay allocation lifetime, seconds. Long enough for a conversation, short enough
# that abandoned allocations are reclaimed.
max-allocate-lifetime=3600
channel-lifetime=600

# Set to enable TURN over TLS. The certificate must be for TURN_DOMAIN; Caddy's
# certificate is for the app domain and will not validate here.
# cert=/etc/coturn/certs/turn.crt
# pkey=/etc/coturn/certs/turn.key
