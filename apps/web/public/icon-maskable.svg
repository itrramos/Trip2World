<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Trip2World">
  <defs>
    <linearGradient id="t2wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Maskable variant: full-bleed background and the mark scaled to sit inside the
       safe zone (the centre 80%), so Android can crop it to any shape — circle,
       squircle, rounded square — without clipping the globe. -->
  <rect width="512" height="512" fill="#0a0f1c"/>

  <g fill="none" stroke="url(#t2wm)" stroke-width="16" stroke-linecap="round">
    <circle cx="256" cy="256" r="104"/>
    <ellipse cx="256" cy="256" rx="47" ry="104"/>
    <path d="M152 256h208"/>
    <path d="M171 204c50 27 120 27 170 0"/>
    <path d="M171 308c50-27 120-27 170 0"/>
  </g>
</svg>
