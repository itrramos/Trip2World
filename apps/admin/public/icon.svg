<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Trip2World Admin">
  <defs>
    <!-- Amber, matching src/app/icon.svg. The admin surface is deliberately a different
         colour from the public app everywhere it appears, so a moderator with both tabs
         open is never one glance away from acting on the wrong one. -->
    <linearGradient id="t2w-admin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0a0f1c"/>

  <!-- Globe: meridians and parallels, suggesting worldwide reach without needing
       a detailed and inevitably politically-loaded coastline. -->
  <g fill="none" stroke="url(#t2w-admin)" stroke-width="18" stroke-linecap="round">
    <circle cx="256" cy="256" r="132"/>
    <ellipse cx="256" cy="256" rx="60" ry="132"/>
    <path d="M124 256h264"/>
    <path d="M148 190c64 34 152 34 216 0"/>
    <path d="M148 322c64-34 152-34 216 0"/>
  </g>
</svg>
